# 문서 사이트를 /docs/ 하위 경로로 섬긴다 — mkdocs.yml 의 site_url 경로와 같다.
# 앞에는 tailscale serve 가 선다: tailscale serve --bg --set-path /docs http://127.0.0.1:8001
server {
    listen 8080;
    server_name _;

    # 비루트(nginx 사용자)라 기본 로그 경로 대신 표준 출력·오류로 — docker logs 가 본다.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 헬스체크 — compose 의 healthcheck 가 친다. 문서 빌드와 무관하게 늘 200.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 루트로 들어오면 문서로 보낸다(컨테이너를 직접 열었을 때).
    location = / {
        return 302 /docs/;
    }

    location /docs/ {
        # MkDocs 는 디렉토리 URL 을 쓴다(/docs/using/ → using/index.html).
        # 끝은 =404 다 — 바로 404.html 로 보내면 없는 쪽수가 200 으로 나간다(실측).
        try_files $uri $uri/ $uri/index.html =404;

        # llms.txt·페이지별 .md 는 브라우저에서도 읽히게 평문으로.
        location ~ \.(txt|md)$ {
            default_type text/plain;
            charset utf-8;
        }
    }

    # 해시가 붙은 자산은 오래 캐시한다. HTML 은 캐시하지 않는다(판이 자주 바뀐다).
    location /docs/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /docs/404.html;
}
