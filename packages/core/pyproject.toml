[project]
name = "harness-catalog-core"
version = "0.1.0"
description = "harness-catalog: settings, model, checks, git reading, validation — shared by server and CLI"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "skills-ref>=0.1.1",
  "anyio>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_catalog_core"]
