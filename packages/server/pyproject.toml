[project]
name = "harness-catalog-server"
version = "0.7.1"
description = "harness-catalog registry process: MCP server + scheduler (container image entry point)"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "harness-catalog-core==0.7.1",
  "mcp==2.3.0",
  "starlette==1.7.0",
  "uvicorn==0.54.0",
  "PyJWT[crypto]==2.15.1",
  "psycopg[binary,pool]==3.3.6",
  "yoyo-migrations==9.0.0",
  "opentelemetry-sdk==1.45.0",
  "opentelemetry-exporter-otlp-proto-http==1.45.0",
]

[project.scripts]
harness-catalog-server = "harness_catalog_server.__main__:main"

[tool.uv.sources]
harness-catalog-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_catalog_server"]
# 마이그레이션 SQL은 패키지 데이터다(importlib.resources로 읽는다)
[tool.hatch.build.targets.sdist]
include = ["src/harness_catalog_server/**", "pyproject.toml"]
