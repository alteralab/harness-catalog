# GitLab 판 — 문면대로 작성만 되었고 아직 실제로 돌린 적이 없다(README 참조). GitHub Actions 판이 먼저다.
stages: [check, evals]

check:
  stage: check
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    GIT_DEPTH: 0
  script:
    - '[ -z "${HARNESS_CATALOG_READ_TOKEN:-}" ] || git config --global url."https://x-access-token:${HARNESS_CATALOG_READ_TOKEN}@github.com/".insteadOf "https://github.com/"'
    - curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
    - BASE=$( [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ] && echo "$CI_MERGE_REQUEST_DIFF_BASE_SHA" || { [ -n "$CI_COMMIT_BEFORE_SHA" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && echo "$CI_COMMIT_BEFORE_SHA"; } || git rev-parse HEAD~1 )
    - uvx --from "harness-catalog-cli @ git+https://github.com/alteralab/harness-catalog@v<판>#subdirectory=packages/cli" harness-catalog check . --rev HEAD --base "$BASE"

evals:
  stage: evals
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $HARNESS_EVALS == "true"
  tags: [harness-catalog]
  parallel:
    matrix:
      - AGENT: [claude-code, codex]   # GitLab은 변수로 matrix를 만들 수 없다 — 목록을 바꾸려면 이 줄을 고친다
  variables:
    HARNESS_SKILL_REF: $CI_COMMIT_SHA
    HARNESS_CATALOG_NAME: $CI_PROJECT_NAME
    GIT_DEPTH: 0
  script:
    - |
      case "$AGENT" in
        claude-code) { [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ "$CLAUDE_FORCE_OAUTH" = "1" ]; } || [ -n "$ANTHROPIC_API_KEY" ] || { echo "claude-code credentials missing"; exit 1; } ;;
        codex) [ -n "$OPENAI_API_KEY" ] || { [ "$CODEX_FORCE_AUTH_JSON" = "1" ] && [ -f "${CODEX_AUTH_JSON_PATH:-$HOME/.codex/auth.json}" ]; } || { echo "codex credentials missing"; exit 1; } ;;
        *) echo "unknown agent $AGENT"; exit 1 ;;
      esac
      [ -n "$LANGFUSE_PUBLIC_KEY" ] && [ -n "$LANGFUSE_SECRET_KEY" ] && [ -n "$LANGFUSE_HOST" ] || { echo "Langfuse keys missing"; exit 1; }
    - |
      harbor_run() { uvx --from "harbor==0.24.0" --with "harbor-langfuse @ git+https://github.com/alteralab/harness-catalog@v<판>#subdirectory=packages/harbor-langfuse" harbor run "$@"; }
      BASE=$( { [ -n "$CI_COMMIT_BEFORE_SHA" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && echo "$CI_COMMIT_BEFORE_SHA"; } || git rev-parse HEAD~1 )
      for d in $(git diff --name-only "$BASE" HEAD -- skills | cut -d/ -f1-2 | sort -u); do
        [ -d "$d/evals" ] || continue
        harbor_run --path "$d/evals" --agent "$AGENT" --env docker --skill "./$d" --plugin harbor_langfuse:LangfusePlugin
        harbor_run --path "$d/evals" --agent "$AGENT" --env docker --plugin harbor_langfuse:LangfusePlugin
      done
