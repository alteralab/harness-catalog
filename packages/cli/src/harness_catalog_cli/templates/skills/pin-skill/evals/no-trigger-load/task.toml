schema_version = "1.4"

[metadata]
description = "세션에 잠깐 넣는 요청(load_skill)에는 내려받지 않는다"

[environment]
build_timeout_sec = 600.0
skills_dir = "/skills"
# 라이브 소비(레지스트리 MCP)가 필요한 케이스는 아래를 채운다 — tailnet에 닿는 --env docker에서만 된다.
# [[environment.mcp_servers]]
# name = "harness-catalog"
# url = "<REGISTRY_URL>"

[agent]
timeout_sec = 600.0

[verifier]
timeout_sec = 120.0
