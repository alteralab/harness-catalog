schema_version = "1.4"

[metadata]
description = "세션에 잠깐 넣는 요청(get_skill)에는 내려받지 않는다"

[environment]
build_timeout_sec = 600.0
skills_dir = "/skills"

# 레지스트리 스텁(같은 네 도구). 진짜 레지스트리는 OAuth 뒤·tailnet 안이라 컨테이너에서 못 쓴다 — 검증 대상은 pin 스킬이지 레지스트리가 아니다.
[[environment.mcp_servers]]
name = "harness-catalog"
transport = "stdio"
command = "uv"
args = ["run", "--script", "/work/stub/registry_stub.py", "/work/stub/fixture"]

[agent]
timeout_sec = 600.0

[verifier]
timeout_sec = 120.0
environment_mode = "shared"   # 검증기가 에이전트 컨테이너의 끝 상태를 직접 본다. 분리 모드(separate)면 artifacts 선언과 tests/Dockerfile이 필요하다
