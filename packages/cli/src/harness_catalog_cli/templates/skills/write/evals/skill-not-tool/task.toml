schema_version = "1.4"

[metadata]
description = "\"스킬로 만들어줘\"에는 스킬을 만든다 — 새 도구를 만들거나 스킬을 도구로 등록하지 않는다"

[environment]
build_timeout_sec = 600.0
skills_dir = "/skills"

# 카탈로그 클론의 도구(tools/scaffold)를 MCP 로 — 세션·루프와 같은 경로. Harbor 가 사용자 범위로 등록해 신뢰 대화상자 없이 뜬다(hc 는 이미지에 있다).
[[environment.mcp_servers]]
name = "toolbox"
transport = "stdio"
command = "hc"
args = ["toolbox", "/work/catalog/tools"]

[agent]
timeout_sec = 600.0

[verifier]
timeout_sec = 120.0
environment_mode = "shared"   # 검증기가 에이전트 컨테이너의 끝 상태를 직접 본다. 분리 모드(separate)면 artifacts 선언과 tests/Dockerfile이 필요하다
