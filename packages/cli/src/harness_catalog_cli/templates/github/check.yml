# PR마다·main push마다 harness-catalog check. main push에는 선택 잡 evals(변수 HARNESS_EVALS=true일 때만).
name: check
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 은퇴한 이름 검사(항목 5)는 전체 이력이 필요하다
      - uses: astral-sh/setup-uv@v5
      - name: base commit
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=$(git merge-base origin/${{ github.base_ref }} HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
      - name: harness-catalog check
        run: uvx --from "harness-catalog-cli @ git+https://github.com/alteralab/harness-catalog@v<판>#subdirectory=packages/cli" harness-catalog check . --rev HEAD --base "${{ steps.base.outputs.sha }}"

  evals:
    if: github.ref == 'refs/heads/main' && vars.HARNESS_EVALS == 'true'
    needs: check
    runs-on: [self-hosted, harness-catalog]
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(format('["{0}"]', join(fromJSON(format('["{0}"]', vars.HARNESS_EVALS_AGENTS || 'claude-code codex')), '","'))) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: credentials present
        run: |
          case "${{ matrix.agent }}" in
            claude-code) [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || [ -n "$ANTHROPIC_API_KEY" ] || { echo "claude-code credentials missing"; exit 1; } ;;
            codex) [ -n "$OPENAI_API_KEY" ] || [ "$CODEX_FORCE_AUTH_JSON" = "1" ] || { echo "codex credentials missing"; exit 1; } ;;
          esac
          [ -n "$LANGFUSE_PUBLIC_KEY" ] && [ -n "$LANGFUSE_SECRET_KEY" ] && [ -n "$LANGFUSE_HOST" ] || { echo "Langfuse keys missing"; exit 1; }
      - name: changed skills
        id: changed
        run: echo "dirs=$(git diff --name-only HEAD~1 HEAD -- skills | cut -d/ -f1-2 | sort -u | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: harbor run
        if: steps.changed.outputs.dirs != ''
        run: |
          for d in ${{ steps.changed.outputs.dirs }}; do
            [ -d "$d/evals" ] || continue
            uvx --from "harbor==0.24.0" --with "harbor-langfuse @ git+https://github.com/alteralab/harness-catalog@v<판>#subdirectory=packages/harbor-langfuse" \
              harbor run --dataset "$d/evals" --agent "${{ matrix.agent }}" --env docker --plugin harbor_langfuse:LangfusePlugin
          done
