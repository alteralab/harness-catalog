# PR마다·main push마다 harness-catalog check. main push에는 선택 잡 evals(변수 HARNESS_EVALS=true일 때만).
# 이 파일은 배선만 한다. 논리(gitleaks·기준 커밋·하네스 자격·harbor 호출)는 CLI `harness-catalog check`·`evals`에 있고 pytest가 검사한다.
# 판을 올리려면 아래 두 줄의 @v<판>을 바꾼다 — 논리는 그 판을 따라온다.
name: check
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # 검사는 HEAD 트리만 본다 — 이력이 필요 없다
      - uses: astral-sh/setup-uv@v5
      - uses: ./.github/actions/code-repo-credentials
        with:
          deploy-key: ${{ secrets.HARNESS_CATALOG_DEPLOY_KEY }}
      - run: uvx --from "harness-catalog-cli @ git+https://github.com/alteralab/harness-catalog@v<판>#subdirectory=packages/cli" harness-catalog check --rev HEAD

  evals:
    if: github.event_name == 'push' && vars.HARNESS_EVALS == 'true'
    needs: [check]
    runs-on: [self-hosted, harness-catalog]
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(vars.HARNESS_EVALS_AGENTS || '["claude-code", "codex"]') }}   # 변수는 JSON 배열
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 바뀐 스킬을 기준 커밋과 견준다
      - uses: astral-sh/setup-uv@v5
      - uses: ./.github/actions/code-repo-credentials
        with:
          deploy-key: ${{ secrets.HARNESS_CATALOG_DEPLOY_KEY }}
      - run: uvx --from "harness-catalog-cli @ git+https://github.com/alteralab/harness-catalog@v<판>#subdirectory=packages/cli" harness-catalog evals --agent "${{ matrix.agent }}"
