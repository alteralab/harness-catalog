[project]
name = "harness-catalog-cli"
version = "0.1.0"
description = "harness-catalog command: check, init, config (author and operator machines, CI)"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "harness-catalog-core==0.1.0",
  "typer==0.27.2",
]

[project.scripts]
harness-catalog = "harness_catalog_cli.__main__:main"

[tool.uv.sources]
harness-catalog-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_catalog_cli"]
# templates/(카탈로그 저장소 템플릿)는 패키지 데이터로 함께 실린다; examples/catalog-template은 이 디렉토리의 심볼릭 링크다
