[project]
name = "harness-catalog-cli"
version = "0.1.0"
description = "harness-catalog command: check, init, config (author and operator machines, CI)"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "harness-catalog-core==0.1.0",
  "typer==0.27.2",
]

[project.scripts]
harness-catalog = "harness_catalog_cli.__main__:main"

[tool.uv.sources]
harness-catalog-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_catalog_cli"]
# 카탈로그 저장소 템플릿(표지·README·pre-commit·CI·기본 스킬 둘)의 원본은 src/harness_catalog_cli/templates/ 하나다.
# 루트에 링크나 사본을 두지 않는다. 실체를 루트에 두고 force-include로 끌어오는 방향은 uv build가 sdist를 거쳐
# wheel을 만들 때 패키지 밖 경로가 없어 실패한다(2026-10-10 실측: "Forced include not found").
