# Dex — Synology Directory Server(LDAP) 연합 판 (distribution D4). 정적 사용자는 없다.
# 커넥터 값은 운영 중인 선례(~/workspace/dp-charts/argocd/values-override.yaml, Argo CD 내장 Dex)와 같다:
# 그룹은 member 속성에 사용자 DN을 담는다(memberUid 아님). bindPW만 환경 변수.
issuer: {{ getenv "DEX_ISSUER" | required "DEX_ISSUER" }}

storage:
  type: postgres
  config:
    host: postgres
    port: 5432
    database: dex
    user: dex
    password: "{{ getenv "DEX_DB_PASSWORD" }}"
    ssl:
      mode: disable

web:
  http: 0.0.0.0:5556

telemetry:
  http: 0.0.0.0:5558

logger:
  level: info
  format: json

oauth2:
  responseTypes: ["code"]
  skipApprovalScreen: true

expiry:
  idTokens: "1h"
  deviceRequests: "5m"
  refreshTokens:
    validIfNotUsedFor: "720h"

staticClients:
  - id: claude-code
    name: Claude Code
    public: true
  - id: codex
    name: Codex
    public: true
  - id: cursor
    name: Cursor
    public: true
  - id: ci-runner
    name: CI runner (unattended read)
    secretEnv: DEX_CI_RUNNER_SECRET
  - id: "{{ getenv "HC_PUBLIC_URL" }}"
    name: harness-catalog registry (audience)
    public: true    # 스스로 인증하지 않는다 — 다른 클라이언트의 토큰 aud에 실리기 위한 등록. 시크릿을 두지 않는다
    trustedPeers: [claude-code, codex, cursor, ci-runner]

connectors:
  - type: ldap
    id: ldap
    name: Synology LDAP
    config:
      host: "{{ getenv "LDAP_HOST" }}"
      # 기본은 LDAPS(636). 선례(dp-charts argocd)는 389 평문이었으나 바인드 비밀번호와 사용자 비밀번호가 평문으로 흐른다(Codex 리뷰).
      # NAS 인증서가 자체 서명이면 LDAP_INSECURE_SKIP_VERIFY=true, 평문으로 되돌리려면 LDAP_INSECURE_NO_SSL=true (r2에서 실측).
      insecureNoSSL: {{ getenv "LDAP_INSECURE_NO_SSL" "false" }}
      insecureSkipVerify: {{ getenv "LDAP_INSECURE_SKIP_VERIFY" "true" }}
      bindDN: "{{ getenv "LDAP_BIND_DN" }}"
      bindPW: "{{ getenv "LDAP_BIND_PW" }}"
      usernamePrompt: LDAP Username
      userSearch:
        baseDN: "{{ getenv "LDAP_USER_BASE_DN" }}"
        filter: ""
        username: uid
        idAttr: dn
        emailAttr: mail
        nameAttr: cn
      groupSearch:
        baseDN: "{{ getenv "LDAP_GROUP_BASE_DN" }}"
        filter: ""                 # 비워 둔다(선례). 그룹 하나만 거르려면 "(cn=skills-readers)"
        userMatchers:
          - userAttr: dn
            groupAttr: member
        nameAttr: cn
