# 우리 팀 변형 (distribution D4·D18): Dex를 Synology LDAP Server 연합 판으로 바꿔 끼운다. 운영(mini)은 이 오버레이를 운영 compose에 겹친다.
# docker compose -f docker-compose.yml -f examples/synology-ldap/docker-compose.override.yml up -d
# 개발(dev compose)에도 겹칠 수 있다: -f docker-compose.dev.yml -f examples/synology-ldap/docker-compose.override.yml
# LDAP 바인드 비밀번호는 파일 비밀(SECRETS_DIR/ldap_bind_pw)이거나 환경 변수 LDAP_BIND_PW 둘 중 하나.
services:
  dex:
    environment:
      LDAP_HOST: ${LDAP_HOST:-192.168.3.95:636}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-uid=admin,cn=users,dc=gyojunan,dc=synology,dc=me}
      LDAP_BIND_PW: ${LDAP_BIND_PW:-}
      LDAP_BIND_PW_FILE: ${LDAP_BIND_PW_FILE:-/run/secrets/ldap_bind_pw}
      LDAP_USER_BASE_DN: ${LDAP_USER_BASE_DN:-cn=users,dc=gyojunan,dc=synology,dc=me}
      LDAP_GROUP_BASE_DN: ${LDAP_GROUP_BASE_DN:-cn=groups,dc=gyojunan,dc=synology,dc=me}
      LDAP_INSECURE_NO_SSL: ${LDAP_INSECURE_NO_SSL:-false}
      LDAP_INSECURE_SKIP_VERIFY: ${LDAP_INSECURE_SKIP_VERIFY:-true}
    secrets:
      - ldap_bind_pw
    volumes:
      - ./examples/synology-ldap/dex/config.yaml:/etc/dex/config.yaml:ro
  registry:
    # 프록시(tailscale serve) 뒤에서 자기 공개 호스트 이름으로 issuer에 닿아야 한다(hairpin). 컨테이너 안에서 그 이름을 호스트의 tailscale IP로 푼다.
    extra_hosts:
      - "${HC_PUBLIC_HOSTNAME:-alteraui-macmini.tail2f9fe3.ts.net}:${HC_HOST_TAILSCALE_IP:-100.97.103.14}"

secrets:
  ldap_bind_pw:
    file: ${SECRETS_DIR:-./secrets}/ldap_bind_pw
