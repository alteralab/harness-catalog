# 루트는 배포물이 아니다 — uv 워크스페이스 선언과 개발 도구 설정만.
[project]
name = "harness-catalog-workspace"
version = "0.1.0"
requires-python = ">=3.12"
description = "workspace root (not a distributable)"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
harness-catalog-core = { workspace = true }
harness-catalog-cli = { workspace = true }
harness-catalog-server = { workspace = true }
harbor-langfuse = { workspace = true }

[dependency-groups]
bench = [
    "kiwipiepy>=0.20",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.3",
]
dev = [
  "harness-catalog-core",
  "harness-catalog-cli",
  "harness-catalog-server",
  "harbor-langfuse",
  "pytest==9.1.1",
  "anyio[trio]==4.15.1",
  "pyright==1.1.414",
  "httpx==0.28.1",
  "jsonschema==4.26.0",  # tests/http: outputSchema 적합성(mcp의 전이 의존이지만 시험이 직접 쓰므로 명시)
  "testcontainers[postgres]==4.15.0",
  "opentelemetry-sdk==1.45.0",
]
# 문서 사이트는 파이썬이 아니다 — docs-site/ 의 Node 앱(Fumadocs + Next 정적 내보내기)이고
# 판은 docs-site/package-lock.json 에 고정된다. 올리는 쪽(scripts/upload_docs.py)만 표준 라이브러리.

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "http: 실제 uvicorn 프로세스 + 가짜 issuer(JWKS). Dex 불필요",
  "pg: docker가 필요하다(testcontainers PostgreSQL)",
]

[tool.pyright]
include = ["packages", "tests", "tools", "scripts"]  # scripts 가 빠져 있어 upload_docs.py 의 타입 결함을 놓쳤다(2026-10-20)
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false  # skills_ref에 py.typed가 없다
typeCheckingMode = "strict"
pythonVersion = "3.12"

# ruff — altera-rules가 조항에 귀속한 룰 집합을 상속한다; 그 외는 켜지 않는다.
# 규칙 저장소는 이 저장소의 형제 체크아웃(../altera-rules)으로 기대한다. 커밋 훅(altera-ruff)이 이 파일을 --config로 받는다.
[tool.ruff]
extend = "../altera-rules/gates/ruff/base.toml"

# extend-per-file-ignores: per-file-ignores로 쓰면 base의 면제를 통째로 덮어쓴다 (syntopicon에서 실측).
[tool.ruff.lint.extend-per-file-ignores]
# 배포물 둘의 진입점은 출력 층이다 — 찍는 것이 일이다 (plans/service.md §2 — server: serve/reindex, cli: init/check/config).
"packages/server/src/harness_catalog_server/__main__.py" = ["T201", "T203"]
"packages/cli/src/harness_catalog_cli/__main__.py" = ["T201", "T203"]
# 실측 도구는 관측값을 JSON 줄로 찍는다 (plans/pilot.md §3).
"tools/pilot/*.py" = ["T201"]

