# 문서 사이트 — 소스는 docs/ 그대로다(복사·이동하지 않는다). 루트의 README·DESIGN 은 include 로 끌어온다.
# 구성은 Zensical 호환 부분집합으로만 한다(플러그인 넷 + superfences mermaid) — Material 이 2027-05 에 끝나고
# CI 가 `zensical build` 를 비차단으로 함께 돌린다. 근거: plans/refactor.md §3 R7, DESIGN §11 2026-10-20 4항.
site_name: harness-catalog
site_description: 팀의 에이전트 스킬을 git 저장소에 두고 하네스에서 MCP 로 찾아 쓰게 하는 스킬·툴 카탈로그.
# llmstxt 플러그인의 필수값이고 llms.txt 의 절대 URL 근거다. 공개 전환 때 공개 도메인으로 교체한다.
site_url: https://ds923plus.tail2f9fe3.ts.net:9810/harness-catalog/   # NAS MinIO 버킷 + 앞의 nginx(portainer repo stacks/minio). tailnet 안에서만
repo_url: https://github.com/alteralab/harness-catalog
docs_dir: docs
strict: true

validation:
  links:
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

# 루트의 README·DESIGN 을 include 하면서 그 안의 저장소 링크(DESIGN.md·PLAN.md·.github/…)를 사이트의 자리로 돌린다.
# 원본 파일은 바꾸지 않는다 — 다시 쓰기는 이 훅 한 곳에만 있다.
hooks:
  - tools/mkdocs_hooks.py

theme:
  name: material
  language: ko
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 어두운 테마로
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: 밝은 테마로
  features:
    # 상단 탭 + 좌 nav + 우 TOC(toc.integrate 를 켜지 않아 TOC 가 오른쪽에 분리된다)
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - tables
  # 기본 slugify 는 한글을 전부 떨어뜨려 제목 id 가 `_1`·`_2` 가 된다(실측) — 문서가 거의 다 한국어이므로
  # 유니코드를 남기는 pymdownx slugify 로 바꾼다. README 의 목차 앵커(`#빠른-시작`)도 이것으로 맞는다.
  - toc:
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
      permalink: true
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.snippets

plugins:
  - search:
      lang: ko
  - include-markdown
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
  - llmstxt:
      markdown_description: >-
        스킬·툴 카탈로그와 MCP 레지스트리. 스킬 하나는 git 저장소의 디렉토리 하나이고, `main` 에 병합된 것이 게시된 판이다.
        레지스트리는 그 저장소를 받아 검사·색인하고 하네스가 MCP 로 물으면 답한다(도구 넷, 전부 읽기).
        전체 본문은 /docs/llms-full.txt 에, 페이지마다 경로 끝에 `.md` 를 붙이면 마크다운 원문이다.
      full_output: llms-full.txt
      sections:
        시작:
          - index.md: 무엇인가, 빠른 시작, 저장소 구성
          - quickstart.md: 명령 둘로 로컬에 전체 띄우기
        사용·작성:
          - using.md: 등록·로그인·찾기·pin
          - authoring.md: 스킬의 모양과 올리는 절차
        운영:
          - operations.md: 설치·프록시·Dex·LDAP·런북
          - configuration.md: 설정 표면 전체의 참조
        개발·설계:
          - development.md: 개발 환경·시험·게이트·릴리스
          - design.md: 설계와 결정의 근거

# 절 이름과 페이지 이름이 같으면 좌 nav 에 "운영 / 운영 / 설정값" 처럼 겹쳐 보인다(실측) — 페이지 쪽 이름을
# README 의 "문서" 표가 쓰는 설명으로 구별한다. index.md 는 첫 페이지라 navigation.indexes 가 절 제목에 붙인다.
nav:
  - 시작:
      - 개요: index.md
      - 빠른 시작: quickstart.md
  - 사용:
      - 찾아 쓰기: using.md
      - 스킬 작성: authoring.md
  - 운영:
      - 설치와 런북: operations.md
      - 설정값: configuration.md
  - 개발:
      - 개발 환경: development.md
      - 설계: design.md
