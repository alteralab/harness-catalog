# 문서 사이트 파이프라인 — 앱 CI(ci.yml)·배포(deploy.sh)와 분리한다(DESIGN §11 2026-10-20 4항 정정).
# 사례(2026-10-20 저장소 확인): Polaris·MkDocs Material 은 GitHub Pages(gh-pages), Airflow 는 ASF 정적 퍼블리시, DataHub·Langfuse 는 Vercel, Dex 는 Netlify —
# 전부 "정적 산출물을 별도 호스팅에, 별도 파이프라인으로". 이 저장소는 GitHub Pages 를 겨냥한다(공개 저장소이거나 조직 플랜이 Pages 를 허용할 때 배포 잡이 돈다;
# 그 전까지는 strict 빌드와 산출물(site) 업로드까지).
name: docs

on:
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "README.md", "DESIGN.md", "tools/mkdocs_hooks.py", "pyproject.toml", "uv.lock", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "README.md", "DESIGN.md", "tools/mkdocs_hooks.py", "pyproject.toml", "uv.lock", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.8"
      - run: uv sync --frozen -p 3.12 --group docs
      # Zensical 을 먼저 — 둘 다 같은 site/ 에 쓴다. 산출물이 되어야 할 것은 MkDocs 의 결과다. 비차단(전환 준비).
      - name: "zensical build (전환 준비 — 비차단)"
        run: uv run zensical build || true
      - name: "mkdocs build --strict (링크·앵커가 깨지면 실패)"
        run: uv run mkdocs build --strict
      - name: llms.txt 확인
        run: head -20 site/llms.txt && test -s site/llms-full.txt
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site

  # 문서 사이트는 tailnet 안 NAS 의 MinIO 버킷에 올린다(DESIGN §11 2026-10-20 4항).
  # 그래서 호스팅 러너가 아니라 tailnet 안의 self-hosted 러너에서 돈다. 주소·버킷은 저장소 변수,
  # 자격은 시크릿이다 — 비어 있으면(포크 등) 조용히 건너뛴다.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCS_MINIO_ENDPOINT != ''
    needs: build
    runs-on: [self-hosted, harness-catalog]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.8"
      - run: uv sync --frozen -p 3.12 --group docs
      - run: uv run mkdocs build --strict
      - name: "MinIO 버킷으로 거울 올리기(없어진 쪽수는 지운다)"
        env:
          MINIO_ENDPOINT: ${{ vars.DOCS_MINIO_ENDPOINT }}
          MINIO_BUCKET: ${{ vars.DOCS_MINIO_BUCKET }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: uv run python scripts/upload_docs.py site
