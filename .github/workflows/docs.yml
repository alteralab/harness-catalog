# 문서 사이트 파이프라인 — 앱 CI(ci.yml)·배포(deploy.sh)와 분리한다(DESIGN §11 2026-10-20 4항).
# 사례(2026-10-20 저장소 확인): Polaris·MkDocs Material 은 GitHub Pages(gh-pages), Airflow 는 ASF 정적 퍼블리시,
# DataHub·Langfuse 는 Vercel, Dex 는 Netlify — 전부 "정적 산출물을 별도 호스팅에, 별도 파이프라인으로".
#
# 이 저장소의 그 자리는 tailnet 안 NAS 의 MinIO 버킷이다. 사이트는 docs-site/ 의 Fumadocs(Next 정적 내보내기)로
# 짓고 산출물은 docs-site/out 이다(옛 mkdocs 의 site/ 자리). 콘텐츠는 저장소의 docs/*.md 그대로다.

name: docs

on:
  pull_request:
    paths: ["docs/**", "docs-site/**", "README.md", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "docs-site/**", "README.md", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
        working-directory: docs-site
      # 빌드 뒤 scripts/after-build.mjs 가 돈다 — 쪽마다 index.html, basePath 밖 자산 0개,
      # llms.txt·llms-full.txt 비어 있지 않음, 검색 색인 JSON 파싱. 하나라도 어긋나면 실패한다.
      - run: npm run build
        working-directory: docs-site
      - name: llms.txt 확인
        run: head -20 docs-site/out/llms.txt && test -s docs-site/out/llms-full.txt
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: docs-site/out

  # 문서 사이트는 tailnet 안 NAS 의 MinIO 버킷에 올린다. 그래서 호스팅 러너가 아니라
  # tailnet 안의 self-hosted 러너에서 돈다. 주소·버킷은 저장소 변수, 자격은 시크릿이다 —
  # 비어 있으면(포크 등) 조용히 건너뛴다.
  publish:
    if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && vars.DOCS_MINIO_ENDPOINT != ''
    needs: build
    runs-on: [self-hosted, harness-catalog]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
        working-directory: docs-site
      - run: npm run build
        working-directory: docs-site
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.8"
      - name: "MinIO 버킷으로 거울 올리기(없어진 쪽수는 지운다)"
        env:
          MINIO_ENDPOINT: ${{ vars.DOCS_MINIO_ENDPOINT }}
          MINIO_BUCKET: ${{ vars.DOCS_MINIO_BUCKET }}
          # 전용 사용자다 — 버킷 하나에만 읽기·쓰기(정책 harness-catalog-docs-rw). root 가 아니다.
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        # 표준 라이브러리만 쓰는 스크립트다 — 워크스페이스를 sync 하지 않는다.
        run: uv run --no-project python scripts/upload_docs.py docs-site/out
