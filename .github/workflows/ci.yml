# 코드 저장소 CI: PR마다 게이트·타입·시험. main 병합이면 이미지를 mini 러너에서 한 번 빌드해 GHCR로(짧은 SHA 태그, 보존 5개).
name: ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]   # 판 태그면 이미지를 그 태그 이름으로도 올린다

jobs:
  test:
    runs-on: ubuntu-latest   # 러너의 docker 데몬을 testcontainers가 그대로 쓴다
    env:
      ALTERALAB_READ_TOKEN: ${{ secrets.ALTERALAB_READ_TOKEN }}   # if:에서는 secrets 컨텍스트를 못 쓴다 — env로 옮긴다
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.8"
      - name: gitleaks
        run: curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
      - name: sync
        run: uv sync --frozen -p 3.12
      - name: "altera-rules checkout (비공개 저장소 — 시크릿 ALTERALAB_READ_TOKEN, Contents read)"
        if: ${{ env.ALTERALAB_READ_TOKEN != '' }}
        run: |
          git clone -q --branch rules-v0.10.0 "https://x-access-token:${ALTERALAB_READ_TOKEN}@github.com/alteralab/altera-rules" ../altera-rules
          echo "RULES_OK=1" >> "$GITHUB_ENV"
      - name: gates (ruff · ast-grep · shellcheck · declared)
        if: ${{ env.RULES_OK == '1' }}
        run: |
          ../altera-rules/scripts/install_surfaces.py
          uvx pre-commit run --all-files
      - name: gates skipped
        if: ${{ env.RULES_OK != '1' }}
        run: echo "::warning::altera-rules를 받을 토큰(ALTERALAB_READ_TOKEN)이 없어 규칙 게이트를 건너뛴다 — 로컬 pre-commit이 유일한 게이트다"
      - name: pyright
        run: uv run pyright packages tests tools
      - name: pytest
        run: uv run pytest -q tests

  image:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: test
    runs-on: [self-hosted, harness-catalog]   # 빌드 기계 = 실행 기계(mini). 운영 compose는 같은 데몬의 이미지를 pull 없이 쓴다
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: tag
        id: tag
        run: |
          # main 병합 → 짧은 SHA, 판 태그(vX.Y.Z) → 그 이름. 운영 .env의 REGISTRY_IMAGE에는 판 태그를 적는다
          case "$GITHUB_REF" in
            refs/tags/v*) echo "sha=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT" ;;
            *) echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: login ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: build · push
        run: |
          IMG=ghcr.io/alteralab/harness-catalog:${{ steps.tag.outputs.sha }}
          docker build -t "$IMG" .
          docker push "$IMG"
          docker image inspect "$IMG" --format 'digest={{index .RepoDigests 0}}' | tee -a "$GITHUB_STEP_SUMMARY"
      # 보존: 먼저 태그 없는 버전을 지우고, 그다음 최신 5개(= SHA 태그 5개)만 남긴다. 순서가 바뀌면 SHA 태그가 5개 미만이 된다.
      # 이 저장소가 GHCR 패키지의 Actions access에서 Admin이어야 GITHUB_TOKEN으로 삭제할 수 있다(패키지 설정, 한 번).
      - name: untagged
        uses: actions/delete-package-versions@v5
        continue-on-error: true   # 지울 것이 없으면 액션이 TypeError로 죽는다(2026-10-07 실측) — 보존은 best-effort, 빌드·push는 이미 끝났다
        with:
          package-name: harness-catalog
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: true
      - name: retention (SHA 태그 최근 5개 — 판 태그 vX.Y.Z는 지우지 않는다)
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: harness-catalog
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: false
          ignore-versions: '^v\d+\.\d+\.\d+$'
